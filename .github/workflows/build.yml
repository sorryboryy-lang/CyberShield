name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 kivy

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/#title = My Application/title = CyberShield/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = cybershield/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.cybershield/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: CyberShield-APK
        path: bin/*.apk
